name: Deploy (manual, production)

# SCAFFOLD -- disabled by default. No server hostname, SSH credentials,
# deployment path, or registry are configured in this repository yet, so
# this workflow cannot and does not make any remote connection today. See
# docs/CI_CD.md "Deployment prerequisites" for exactly what must exist
# before the commented-out steps near the bottom of this file can be
# enabled. Do not add secrets or uncomment anything here without reviewing
# that document first.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm you intend to deploy main to production'
        required: true
        type: string

# Only one deploy (and one set of preflight checks) at a time, ever. A
# second dispatch while one is in flight queues behind it rather than
# running concurrently against the same server.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  # Read-only: needed to look up whether ci.yml already passed for the
  # commit being deployed. Nothing in this workflow writes anywhere.
  actions: read

jobs:
  preflight:
    name: Validate deployment request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the main branch
        # workflow_dispatch can be run from any branch by default; a
        # protected Environment alone does not guarantee that, so this is
        # checked explicitly as defense in depth. (Also configure the
        # production Environment's "Deployment branches" rule to `main` in
        # GitHub repo settings -- see docs/CI_CD.md.)
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Deployments are only allowed from main (got ${{ github.ref }})."
            exit 1
          fi

      - name: Require explicit confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy" ]; then
            echo "::error::Confirmation input must be exactly 'deploy'."
            exit 1
          fi

      - name: Require a successful CI run for this exact commit
        # A manual dispatch only proves someone clicked a button, not that
        # this commit passed ci.yml. Query the Actions API for the most
        # recent "CI" run against this SHA and refuse to proceed unless its
        # conclusion is "success".
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs_json=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${{ github.sha }}&status=completed" \
            --jq '.workflow_runs')
          conclusion=$(echo "$runs_json" | jq -r '.[0].conclusion // "none"')
          if [ "$conclusion" != "success" ]; then
            echo "::error::No successful CI run found for commit ${{ github.sha }} (latest conclusion: $conclusion)."
            echo "Push/re-run ci.yml for this commit and let it pass before deploying."
            exit 1
          fi
          echo "CI passed for ${{ github.sha }}."

  deploy:
    name: Deploy to production
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Requires the 'production' Environment to exist in repo Settings, with
    # required reviewers configured there -- that approval gate is enforced
    # by GitHub itself, not by this workflow file. See docs/CI_CD.md.
    environment:
      name: production
    permissions:
      contents: read
    env:
      # Fixed, not configurable: this deployment must only ever touch its
      # own directory, never another project's. Hardcoding this (instead
      # of a variable) removes an entire class of misconfiguration risk.
      DEPLOY_PATH: /opt/skinai-ai-service
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check deployment configuration
        # This repository does not yet define a deployment target. Rather
        # than attempt a connection with missing/empty values, fail loudly
        # here with exactly what's missing. This step is the only thing
        # that currently runs in production `environment:` context.
        env:
          DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          missing=()
          [ -z "$DEPLOY_SSH_HOST" ] && missing+=("vars.DEPLOY_SSH_HOST")
          [ -z "$DEPLOY_SSH_USER" ] && missing+=("vars.DEPLOY_SSH_USER")
          [ -z "$DEPLOY_SSH_PRIVATE_KEY" ] && missing+=("secrets.DEPLOY_SSH_PRIVATE_KEY")
          [ -z "$DEPLOY_SSH_KNOWN_HOSTS" ] && missing+=("secrets.DEPLOY_SSH_KNOWN_HOSTS")

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Deployment is not configured. Missing: ${missing[*]}"
            echo "See docs/CI_CD.md 'Deployment prerequisites' for the full list" \
                 "of required secrets/variables and server-side setup steps."
            exit 1
          fi

          echo "::error::All required secrets/variables are present, but the" \
               "actual deploy steps are still commented out in this workflow" \
               "pending a reviewed server-side rollout script. See the bottom" \
               "of .github/workflows/deploy.yml and docs/CI_CD.md."
          exit 1

      # ----------------------------------------------------------------
      # Everything below is commented out on purpose. It sketches the
      # intended production deploy path so it can be reviewed and enabled
      # deliberately once docs/CI_CD.md's prerequisites are all satisfied --
      # it is not live, does not run, and makes no network connection.

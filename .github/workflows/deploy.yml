      # - name: Write SSH private key
      #   run: |
      #     install -m 600 /dev/null "$HOME/.ssh/deploy_key"
      #     printf '%s\n' "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > "$HOME/.ssh/deploy_key"
      #
      # - name: Pin the server's host key (never StrictHostKeyChecking=no)
      #   run: |
      #     mkdir -p "$HOME/.ssh"
      #     printf '%s\n' "${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}" > "$HOME/.ssh/known_hosts"
      #     chmod 644 "$HOME/.ssh/known_hosts"

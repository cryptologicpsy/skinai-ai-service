      # - name: Deploy image by commit SHA, migrate, restart, health-check
      #   env:
      #     DEPLOY_HOST: ${{ vars.DEPLOY_SSH_HOST }}
      #     DEPLOY_USER: ${{ vars.DEPLOY_SSH_USER }}
      #     IMAGE_REF: ${{ vars.DEPLOY_REGISTRY }}/skinai-ai-service:${{ github.sha }}
      #   run: |
      #     ssh -i "$HOME/.ssh/deploy_key" -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
      #       "$DEPLOY_USER@$DEPLOY_HOST" \
      #       "cd $DEPLOY_PATH && ./deploy.sh $IMAGE_REF"
      #     # deploy.sh lives on the VPS at /opt/skinai-ai-service (reviewed
      #     # and version-controlled separately from this repo) and MUST:
      #     #   0. operate only inside /opt/skinai-ai-service, using that
      #     #      directory's own compose.yaml / project name -- never a
      #     #      bare `docker ...` command that could match a container
      #     #      from another project, and never `docker system prune` /
      #     #      `docker volume prune` (those are NOT project-scoped and

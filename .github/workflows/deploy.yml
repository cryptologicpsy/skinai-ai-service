      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Deployment run"
            echo ""
            echo "- Branch: \`${{ github.ref_name }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Triggered by: ${{ github.actor }}"
            echo "- Result: deployment is **not enabled** -- see docs/CI_CD.md"
          } >> "$GITHUB_STEP_SUMMARY"
